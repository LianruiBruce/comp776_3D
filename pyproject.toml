[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-layers-lab"
version = "0.1.0"
description = "Layer-wise identity analysis for face-recognition vision transformers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Lianrui Geng"}]
dependencies = [
  "huggingface-hub==0.35.3",
  "matplotlib==3.10.7",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "Pillow==12.3.0",
  "psutil==7.1.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
  "seaborn==0.13.2",
  "timm==1.0.20",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "tqdm==4.67.1",
  "transformers==4.56.2",
]

[project.scripts]
id-layers-run = "id_layers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
