schema_version: 1

experiment:
  name: fei_full_lvface_layers
  seed: 20260902
  deterministic: true
  verify_full_extraction_repeat: true
  output_root: artifacts/runs
  save_embeddings: true
  interpretation_scope: FEI development and internal evaluation; external confirmation still required

assets:
  lock_file: configs/assets.lock.yaml

data:
  name: fei_full
  asset_name: fei_full
  type: fei_full
  archive_root: data/raw/fei
  source_root: data/processed/fei_full/source
  processed_root: data/processed/fei_full/aligned
  manifest_path: data/manifests/fei_full_seed20260902.csv
  expected_identities: 200
  expected_conditions_per_identity: 14
  reuse_preprocessing: true
  split_identity_counts:
    train: 100
    dev: 50
    internal_eval: 50
  preprocessing:
    alignment: insightface_arcface_five_point
    detector_asset_name: insightface_buffalo_l_scrfd10g
    insightface_checkout_path: third_party/InsightFace
    detector_model_name: buffalo_l
    detector_cache_root: artifacts/cache/models/insightface
    detector_model_path: artifacts/cache/models/insightface/models/buffalo_l/det_10g.onnx
    providers: [CUDAExecutionProvider, CPUExecutionProvider]
    require_cuda: true
    ctx_id: 0
    detector_input_size: [640, 640]
    detection_threshold: 0.5
    output_size: 112
    image_size: 112
    resize_policy: none_after_alignment
    interpolation: bilinear
    normalization_mean: [0.5, 0.5, 0.5]
    normalization_std: [0.5, 0.5, 0.5]

model:
  name: lvface_t_glint360k
  architecture: vit_t
  third_party_path: third_party/LVFace
  weights_path: artifacts/cache/models/LVFace/LVFace-T_Glint360K/LVFace-T_Glint360K.pt
  device: cuda
  batch_size: 64
  num_workers: 0
  representations:
    - token_mean
    - head_projected

evaluation:
  profiling_splits: [dev]
  selection_split: dev
  selection_metric: template_tar_at_far_0.01
  selection_tiebreak_metrics: [template_d_prime, template_roc_auc]
  threshold_calibration_split: dev
  final_evaluation_split: internal_eval
  far_targets: [0.01]
  condition_splits: [dev, internal_eval]
  bootstrap_resamples: 1000
  bootstrap_seed: 20260902
