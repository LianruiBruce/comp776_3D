schema_version: 1

experiment:
  name: smoke_fei_aligned_lvface_t
  seed: 776
  deterministic: true
  verify_full_extraction_repeat: true
  output_root: artifacts/runs
  save_embeddings: false

assets:
  lock_file: configs/assets.lock.yaml

data:
  name: fei_aligned
  archive_root: data/raw/fei
  processed_root: data/processed/fei_aligned
  manifest_path: data/manifests/fei_aligned_seed776.csv
  expected_identities: 200
  expected_conditions_per_identity: 2
  split_identity_counts:
    dev: 120
    val: 40
    test: 40
  condition_labels:
    a: neutral
    b: smile
  preprocessing:
    alignment: dataset_manual
    resize_policy: stretch
    image_size: 112
    interpolation: bilinear
    normalization_mean: [0.5, 0.5, 0.5]
    normalization_std: [0.5, 0.5, 0.5]

model:
  name: lvface_t_glint360k
  architecture: vit_t
  third_party_path: third_party/LVFace
  weights_path: artifacts/cache/models/LVFace/LVFace-T_Glint360K/LVFace-T_Glint360K.pt
  device: cuda
  batch_size: 64
  num_workers: 0
  representations:
    - token_mean
    - head_projected

evaluation:
  profiling_splits: [dev, val]
  selection_split: dev
  selection_metric: d_prime
  threshold_calibration_split: val
  final_evaluation_split: test
  far_targets: [0.01]
